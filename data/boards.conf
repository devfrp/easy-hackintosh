# data/boards.conf — versions macOS téléchargeables via macrecovery.py
# Format : cle|nom affiché|board-id|MLB
# Le board-id détermine la version récupérée avec "-os default".
# MLB = 00000000000000000 → dernière recovery en ligne pour ce modèle.
# Source des board-id : OpenCorePkg/Utilities/macrecovery + guide Dortania.
# NB : les board-id des versions récentes (13/14/15/26) peuvent évoluer côté Apple ;
#      override possible avec EH_BOARD_ID / EH_MLB au lancement.
# Tahoe (26) : DERNIÈRE version macOS avec support Intel, limité à 4 modèles réels
#      (MacPro7,1 / MacBookPro16,1 / MacBookPro16,2 / iMac20,1-2). board-id ci-dessous
#      = iMac20,1 (Mac-CFF7D910A743CAAF), vérifié croisé Dortania SMBIOS + AppleDB.
